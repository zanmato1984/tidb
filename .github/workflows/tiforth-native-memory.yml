name: TiForth native memory

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/tiforth-native-memory.yml'
      - 'docs/exec-plans/tiforth-native-memory-ci.md'
      - 'AGENTS.md'
      - 'PLANS.md'
  push:
    branches: ['tiforth/**', 'task/**', 'codex/**']
    paths:
      - 'rust/**'
      - '.github/workflows/tiforth-native-memory.yml'
      - 'docs/exec-plans/tiforth-native-memory-ci.md'
      - 'AGENTS.md'
      - 'PLANS.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      host_source_sha:
        description: Exact nonzero 40-hex commit in zanmato1984/tidb
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiforth-native-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '33554432'
    steps:
      - name: Validate caller context and exact host source
        id: source
        working-directory: .
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_EVENT_ACTION: ${{ github.event.action }}
          CALLER_REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EVENT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_HOST_SOURCE_SHA: ${{ inputs.host_source_sha }}
        run: |
          set -euo pipefail
          reject() { printf '%s\n' 'native-memory caller/source rejected' >&2; exit 1; }
          case "$CALLER_REPOSITORY" in
            zanmato1984/tidb)
              case "$CALLER_EVENT" in pull_request|push|workflow_dispatch) ;; *) reject ;; esac
              [[ "$EVENT_HEAD_REPOSITORY" == 'zanmato1984/tidb' ]] || reject
              [[ "$CALLER_WORKFLOW_REF" == "zanmato1984/tidb/.github/workflows/tiforth-native-memory.yml@$CALLER_REF" ]] || reject
              source_sha="$EVENT_SOURCE_SHA"
              [[ -z "$REQUESTED_HOST_SOURCE_SHA" || "$REQUESTED_HOST_SOURCE_SHA" == "$source_sha" ]] || reject
              ;;
            zanmato1984/tiforth)
              [[ "$EVENT_HEAD_REPOSITORY" == 'zanmato1984/tiforth' ]] || reject
              case "$CALLER_EVENT" in
                workflow_dispatch) [[ "$CALLER_REF" == refs/heads/* ]] || reject ;;
                pull_request)
                  case "$CALLER_EVENT_ACTION" in opened|synchronize|reopened) ;; *) reject ;; esac
                  [[ "$CALLER_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]] || reject
                  ;;
                *) reject ;;
              esac
              [[ "$CALLER_WORKFLOW_REF" == "zanmato1984/tiforth/.github/workflows/host-native-memory.yml@$CALLER_REF" ]] || reject
              source_sha="$REQUESTED_HOST_SOURCE_SHA"
              ;;
            *) reject ;;
          esac
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" != '0000000000000000000000000000000000000000' ]] || reject
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact event head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: zanmato1984/tidb
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - name: Verify exact host checkout
        working-directory: .
        env:
          EXPECTED_HOST_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          [[ "$actual_source_sha" == "$EXPECTED_HOST_SOURCE_SHA" ]] || { printf '%s\n' 'native-memory host checkout rejected' >&2; exit 1; }

      - name: Prepare diagnostics
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/tiforth-native-memory-cargo"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/tiforth-native-memory-target"
          export NATIVE_MEMORY_LOGS="$RUNNER_TEMP/tiforth-native-memory-logs"
          printf '%s\n' "CARGO_HOME=$CARGO_HOME" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" "NATIVE_MEMORY_LOGS=$NATIVE_MEMORY_LOGS" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$NATIVE_MEMORY_LOGS"
          df -h . "$HOME" | tee "$NATIVE_MEMORY_LOGS/disk-before.log"
          git rev-parse HEAD | tee "$NATIVE_MEMORY_LOGS/source-head.log"

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$NATIVE_MEMORY_LOGS/apt-update.log"
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libssl-dev protobuf-compiler python3 2>&1 | tee "$NATIVE_MEMORY_LOGS/apt-install.log"

      - name: Install exact native nightly and test runner
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-22 --profile minimal --component rustfmt --component clippy --no-self-update 2>&1 | tee "$NATIVE_MEMORY_LOGS/toolchain-install.log"
          cargo +nightly-2026-08-22 install --locked cargo-nextest --version 0.9.152 --root "$RUNNER_TEMP/tiforth-native-memory-nextest" 2>&1 | tee "$NATIVE_MEMORY_LOGS/nextest-install.log"
          echo "$RUNNER_TEMP/tiforth-native-memory-nextest/bin" >> "$GITHUB_PATH"
          rustc +nightly-2026-08-22 -Vv | tee "$NATIVE_MEMORY_LOGS/rustc.log"
          "$RUNNER_TEMP/tiforth-native-memory-nextest/bin/cargo-nextest" --version | tee "$NATIVE_MEMORY_LOGS/nextest-version.log"

      - name: Test identity guard and shell failure propagation
        run: |
          set -euo pipefail
          python3 scripts/test_check_tiforth_native_memory.py -v 2>&1 | tee "$NATIVE_MEMORY_LOGS/python-tests.log"

      - name: Check locked native dependency identities
        env:
          TIFORTH_DEPENDENCY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Process-only config; never put a token in a helper command or URL.
          printf -v credential_helper '!python3 %q' "$PWD/scripts/tiforth-dependency-credential.py"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=credential.useHttpPath GIT_CONFIG_VALUE_1=true
          export GIT_CONFIG_KEY_2=credential.helper
          export GIT_CONFIG_VALUE_2="$credential_helper"
          trap 'unset TIFORTH_DEPENDENCY_TOKEN credential_helper CARGO_NET_GIT_FETCH_WITH_CLI GIT_TERMINAL_PROMPT GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2' EXIT
          cargo +nightly-2026-08-22 metadata --locked --format-version 1 > "$NATIVE_MEMORY_LOGS/metadata.json" 2> "$NATIVE_MEMORY_LOGS/metadata.stderr.log"
          unset TIFORTH_DEPENDENCY_TOKEN
          python3 scripts/check-tiforth-native-memory.py --workspace . --metadata "$NATIVE_MEMORY_LOGS/metadata.json" 2>&1 | tee "$NATIVE_MEMORY_LOGS/identity.log"

      - name: Check bridge all targets and features
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-22 check --locked -p tidb-tiforth-memory --all-targets --all-features 2>&1 | tee "$NATIVE_MEMORY_LOGS/bridge-check.log"

      - name: Check scoped formatting
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-22 fmt --package tidb-tiforth-memory -- --check 2>&1 | tee "$NATIVE_MEMORY_LOGS/bridge-fmt.log"

      - name: Check strict bridge Clippy
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-22 clippy --locked -p tidb-tiforth-memory --all-targets --all-features --no-deps -- -D warnings 2>&1 | tee "$NATIVE_MEMORY_LOGS/bridge-clippy.log"

      - name: Run complete bridge tests without retries
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-22 nextest run --locked -p tidb-tiforth-memory --all-features --test-threads 2 --no-fail-fast --retries 0 2>&1 | tee "$NATIVE_MEMORY_LOGS/bridge-tests.log"
          cargo +nightly-2026-08-22 test --locked -p tidb-tiforth-memory --all-features --doc 2>&1 | tee "$NATIVE_MEMORY_LOGS/bridge-doc-tests.log"

      - name: Run public native owned root example
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-22 run --locked -p tidb-tiforth-memory --example native_owned_root 2>&1 | tee "$NATIVE_MEMORY_LOGS/public-example.log"

      - name: Run unchanged native Chunk suite without retries
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-22 nextest run --locked -p tidb-chunk --test-threads 2 --no-fail-fast --retries 0 2>&1 | tee "$NATIVE_MEMORY_LOGS/native-chunk-tests.log"

      - name: Build required default Jemalloc server
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-22 build --locked -p tidb-server 2>&1 | tee "$NATIVE_MEMORY_LOGS/server-build.log"

      - name: Record final disk usage
        if: always()
        run: |
          set -euo pipefail
          df -h . "$HOME" | tee "$NATIVE_MEMORY_LOGS/disk-after.log"

      - name: Retain diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tiforth-native-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tiforth-native-memory-logs
          retention-days: 7
          if-no-files-found: error
